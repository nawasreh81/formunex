<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FormuNex — منصة البحث والتطوير الغذائي · Food R&amp;D platform">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FormuNex">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<title>FormuNex</title>
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
/* Layout: lab-notebook app — narrow ink sidebar of modules, wide graph-paper work surface */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E8ECE5; --line:#D3DACF; --ink:#16231D; --muted:#5D6B63;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --saffron:#B8741A; --saffron-soft:#F6E7CF;
  --good:#2E7D4F; --warn:#B26A00; --bad:#B3392F; --grid:rgba(46,106,78,.06);
  --side:#16231D; --side-ink:#DDE7E0; --side-mute:#8FA69A;
  --f-display:"Reem Kufi","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#16201B; --sunk:#1D2A23; --line:#2C3B33; --ink:#E4ECE6; --muted:#97A89F;
  --accent:#6FBF94; --accent-ink:#0F1613; --saffron:#E3A64F; --saffron-soft:#3A2C17;
  --good:#6FCF95; --warn:#F0B44C; --bad:#F07F72; --grid:rgba(111,191,148,.05);
  --side:#0A0F0D; --side-ink:#DDE7E0; --side-mute:#7E958A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#16201B; --sunk:#1D2A23; --line:#2C3B33; --ink:#E4ECE6; --muted:#97A89F;
  --accent:#6FBF94; --accent-ink:#0F1613; --saffron:#E3A64F; --saffron-soft:#3A2C17;
  --good:#6FCF95; --warn:#F0B44C; --bad:#F07F72; --grid:rgba(111,191,148,.05);
  --side:#0A0F0D; --side-ink:#DDE7E0; --side-mute:#7E958A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--side);color:var(--side-ink);padding-block:22px;padding-inline:16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--saffron);display:grid;place-items:center;color:#1b1206;font-family:var(--f-display);font-size:20px;font-weight:700}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;color:var(--side-mute);font-size:11px;line-height:1.2}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--side-ink);font-size:14px}
nav button svg{width:18px;height:18px;flex:none;opacity:.8}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--saffron)}
[dir="rtl"] nav button.on{box-shadow:inset -3px 0 0 var(--saffron)}
nav button:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--side-mute)}
.side-foot .row{display:flex;gap:6px}
.chipbtn{all:unset;cursor:pointer;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--side-ink)}
.chipbtn:hover{background:rgba(255,255,255,.08)}
.chipbtn:focus-visible{outline:2px solid var(--saffron)}
main{min-width:0;padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:2px 0 0;max-width:62ch}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-discovery{background:var(--saffron-soft);color:var(--saffron)}
.st-development{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.st-validation{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag{display:inline-block;background:var(--sunk);border-radius:5px;padding:1px 7px;font-size:12px;color:var(--muted);white-space:nowrap}
.allergen{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:5px;padding:1px 8px;font-size:12px;font-weight:500}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sunk);font-size:12px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
td input[type=number]{width:84px;text-align:end;font-family:var(--f-mono)}
td select{width:100%;min-width:170px}
.x{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:5px}
.x:hover{color:var(--bad);background:var(--sunk)}
.tfoot td{font-weight:600;background:var(--sunk)}
.warnline{color:var(--warn);font-size:13px}
.okline{color:var(--good);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nut{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px}
.nut .k{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar>span{display:block;height:100%;background:var(--accent)}
.costbars{display:flex;flex-direction:column;gap:9px}
.costbars .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.costbars .r .bar{grid-column:1/-1;margin:0}
.costbars .r .bar>span{background:var(--saffron)}
.proj{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0}
.proj .meta{color:var(--muted);font-size:12.5px}
.feed li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.feed{list-style:none;margin:0;padding:0}
.feed time{color:var(--muted);font-family:var(--f-mono);font-size:12px;margin-inline-end:8px}
.docs{display:flex;flex-direction:column;gap:10px}
.doc{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.doc:hover,.doc.on{border-color:var(--accent)}
.doc:focus-visible{outline:2px solid var(--accent)}
.doc .t{font-weight:600}
.doc .m{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.reader{white-space:pre-wrap;max-width:68ch}
mark{background:var(--saffron-soft);color:inherit;border-radius:3px;padding:0 2px}
.chat{display:flex;flex-direction:column;height:min(640px,calc(100vh - 170px));min-height:420px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;font-size:14px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-end-end-radius:3px}
.msg.ai{align-self:flex-start;background:var(--sunk);border-end-start-radius:3px}
.msg.ai b{color:var(--accent)}
.composer{display:flex;gap:8px;margin-top:12px}
.msg.md{white-space:normal}.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}.msg ul{margin:4px 0 8px;padding-inline-start:20px}.msg li{margin:2px 0}
.msg .mh{font-weight:600;margin:8px 0 2px}.msg code,.msg .mono{font-family:var(--f-mono);font-size:12.5px}.msg code{background:var(--surface);padding:0 4px;border-radius:4px}
.msg.wide{max-width:96%}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.ftab{width:100%;font-size:13px}.ftab td{padding:3px 6px;border-bottom:1px dashed var(--line)}
.st-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.eff{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;white-space:nowrap;border-radius:6px;padding:2px 8px}
.eff.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}.eff.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.eff.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}.eff.same{background:var(--sunk);color:var(--muted)}
.flag.same{background:var(--sunk);color:var(--muted)}
tr.crit td{background:color-mix(in srgb,var(--bad) 5%,transparent)}
.fimpact{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.ilist{margin:6px 0 0;padding-inline-start:20px;font-size:13.5px}.ilist li{margin:2px 0}
.note-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--sunk);border-radius:8px;padding:8px 10px}
label.btn{position:relative}
.composer input{flex:1}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sugg button{cursor:pointer;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.sugg button:hover{color:var(--accent);border-color:var(--accent)}
.label-card{background:#fff;color:#111;border:2px solid #111;padding:10px 12px;font-family:"Readex Pro",Arial,sans-serif;max-width:360px;width:100%}
.label-card h4{margin:0;font-size:20px;font-weight:700;border-bottom:8px solid #111;padding-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.label-card .ln{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #111;padding:2px 0;font-size:13px}
.label-card .ln.thick{border-bottom:4px solid #111}
.label-card .ln.ind{padding-inline-start:14px}
.label-card .bold{font-weight:700}
.label-card .ing{font-size:11.5px;margin-top:8px;line-height:1.45}
.label-card .fine{font-size:10.5px;margin-top:6px;color:#333}
.scores{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,170px) minmax(110px,170px);gap:8px 12px;align-items:center}
.scores input[type=range]{width:100%;accent-color:var(--accent)}
.scores output{font-size:12.5px;color:var(--muted)}
.scores output b{font-family:var(--f-mono);color:var(--ink);font-size:14px;margin-inline-end:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.toast{max-width:min(640px,calc(100vw - 32px));text-align:center;position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
[dir="rtl"] .toast{transform:translateX(50%)}
.toast.show{opacity:1}
.mobile-top{display:none}
body.auth aside{display:none}body.auth .app{grid-template-columns:minmax(0,1fr)}
.authwrap{min-height:calc(100vh - 80px);display:grid;place-items:center;padding-block:20px}
.authcard{width:min(420px,100%);gap:18px;padding:28px}
.authcard .brand b{color:var(--ink)}.authcard .brand small{color:var(--muted)}
.ubox{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.06)}
.ubox b{display:block;color:var(--side-ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ubox small{color:var(--side-mute);font-size:11px}
.spec-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}.spec-grid span{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select{color:var(--ink);font-size:14px}
.radar text{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.paperwrap{overflow-x:auto;background:var(--sunk);border-radius:12px;padding:18px}
.paperwrap .ps{box-shadow:0 4px 18px rgba(0,0,0,.14);min-width:660px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:7px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:12px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.step-n{font-family:var(--f-mono);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;flex:none;align-self:center}
.step-h .grow{flex:1;min-width:200px}
.step-h .grow select{width:100%}
.step-b{padding:16px;display:flex;flex-direction:column;gap:18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.field .u{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
input.bad{border-color:var(--bad)!important;color:var(--bad)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:12.5px;border-radius:6px;padding:3px 10px}
.flag.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.flag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.flag.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.cutwrap{border:1px dashed var(--line);border-radius:10px;padding:10px;overflow-x:auto;background:var(--bg)}
.cutsvg{display:block;margin-inline:auto}
.cutsvg text{font-family:var(--f-body);fill:var(--ink);font-size:11.5px}
.cutsvg .sm{fill:var(--muted);font-size:10.5px}
.mini{all:unset;cursor:pointer;color:var(--muted);padding:3px 8px;border-radius:5px;font-size:13px}
.mini:hover{color:var(--accent);background:var(--surface)}
.mini:focus-visible{outline:2px solid var(--accent)}
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard .spec{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.mcard .spec span:nth-child(odd){color:var(--muted)}
.tool{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
td input[type=text]{width:100%;min-width:150px}
td select.sm{min-width:120px}
@media (max-width:980px){.g3,.g2{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
  .brand small,.side-foot .hint{display:none}
  nav{flex-direction:row}
  nav button span{display:none}
  nav button{padding:8px}
  nav button.on{box-shadow:inset 0 -3px 0 var(--saffron)!important}
  .side-foot{margin:0;flex-direction:row;align-items:center}
  .ubox small{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
  .msg{max-width:92%}
  .scores{grid-template-columns:minmax(0,1fr) 100px;}
  .scores output{grid-column:1/-1;margin-top:-6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside>
    <div class="brand"><div class="mark">F</div><div><b data-i="brand">FormuNex</b><small data-i="tagline">منصة البحث والتطوير الغذائي</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="userBox"></div>
      <div class="row"><button class="chipbtn" id="langBtn">English</button><button class="chipbtn" id="resetBtn" data-i="reset">بيانات العرض</button><button class="chipbtn" id="installBtn" data-i="install" hidden>تثبيت التطبيق</button></div>
      <div class="hint" data-i="hint">نموذج أولي — البيانات أمثلة توضيحية وتُحفظ في متصفحك فقط.</div>
    </div>
  </aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- i18n ---------- */
const T={

/* ---------- calculations ---------- */
function calc(fid){return calcRows(S.forms[fid].rows)}
function calcRows(rows){
 let sum=0;const n={kcal:0,pro:0,fat:0,sat:0,carb:0,sug:0,fib:0,na:0};let cost=0;const al=new Set();const parts=[];
 rows.forEach(([k,p])=>{const i=ING[k];if(!i)return;p=+p||0;sum+=p;for(const x in n)n[x]+=i[x]*p/100;const c=i.cost*p/100;cost+=c;parts.push({k,p,c});if(p>0)(i.al||[]).forEach(a=>al.add(a))});
 // normalise nutrition to 100 g of finished mix
 if(sum>0)for(const x in n)n[x]=n[x]*100/sum;
 const costKg=sum>0?cost*100/sum:0;
 parts.sort((a,b)=>b.c-a.c);
 return{sum:Math.round(sum*100)/100,n,costKg,al:[...al],parts};
}

function radar(a,b){
 const W=340,H=300,cx=170,cy=150,R=105,n=ATTRS.length;
 const pt=(i,val)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const r=R*(val-1)/8;return[cx+r*Math.cos(ang),cy+r*Math.sin(ang)]};
 let g="";[3,5,7,9].forEach(l=>{g+=`<polygon points="${ATTRS.map((_,i)=>pt(i,l).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`});
 ATTRS.forEach((k,i)=>{const[x,y]=pt(i,9);const[lx,ly]=pt(i,10.6);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${L().attrs[k]}</text>`});
 [[a,"var(--saffron)"],[b,"var(--accent)"]].forEach(([s,col])=>{if(!s)return;g+=`<polygon points="${s.map((val,i)=>pt(i,val).join(",")).join(" ")}" fill="${col}" fill-opacity=".14" stroke="${col}" stroke-width="2"/>`+s.map((val,i)=>{const[x,y]=pt(i,val);return `<circle cx="${x}" cy="${y}" r="3" fill="${col}"/>`}).join("")});
 [5,9].forEach(l=>{const[x,y]=pt(0,l);g+=`<text x="${x+4}" y="${y}" text-anchor="start" style="font-family:var(--f-mono);font-size:9.5px">${l}</text>`});
 return `<svg class="radar" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px;display:block;margin-inline:auto" role="img" aria-label="radar">${g}</svg>`;
}

 en:["","Dislike extremely","Dislike very much","Dislike moderately","Dislike slightly","Neither like nor dislike","Like slightly","Like moderately","Like very much","Like extremely"]};
const P0={triangle:1/3,duotrio:1/2};

function lnC(n,k){let s=0;for(let i=1;i<=k;i++)s+=Math.log(n-k+i)-Math.log(i);return s}
function pTail(n,x,p){if(x<=0)return 1;let s=0;for(let k=x;k<=n;k++)s+=Math.exp(lnC(n,k)+k*Math.log(p)+(n-k)*Math.log(1-p));return Math.min(1,s)}
function minCorrect(n,p,a){for(let x=0;x<=n;x++)if(pTail(n,x,p)<=a)return x;return null}
function sd(arr){if(arr.length<2)return 0;const m=arr.reduce((a,b)=>a+b,0)/arr.length;return Math.sqrt(arr.reduce((s,x)=>s+(x-m)*(x-m),0)/(arr.length-1))}
function newCodes(used,k){const out=[];while(out.length<k){const c=100+Math.floor(Math.random()*900);if(!used.has(c)){used.add(c);out.push(c)}}return out}
function makeRow(t,i,used){const TRI=["AAB","ABA","BAA","ABB","BAB","BBA"],DUO_C=[["A","AB"],["A","BA"]],DUO_B=[["A","AB"],["B","BA"],["A","BA"],["B","AB"]];
 if(t.method==="triangle")return{n:"",seq:TRI[i%6],codes:newCodes(used,3),ans:null};
 const o=(t.refMode==="bal"?DUO_B:DUO_C)[i%(t.refMode==="bal"?4:2)];return{n:"",ref:o[0],seq:o[1],codes:newCodes(used,2),ans:null}}
function rowCorrect(t,r){if(r.ans==null)return null;if(t.method==="triangle"){const odd=[...r.seq].find(c=>r.seq.split(c).length===2);return r.seq[r.ans]===odd}return r.seq[r.ans]===r.ref}
function testStats(t){const done=t.rows.filter(r=>r.ans!=null),n=done.length,x=done.filter(r=>rowCorrect(t,r)).length,p0=P0[t.method];
 const p=n?pTail(n,x,p0):null,need=n?minCorrect(n,p0,t.alpha):null,pd=n?Math.max(0,(x/n-p0)/(1-p0)):0;return{n,x,p0,p,need,pd,sig:p!=null&&p<=t.alpha}}
function seedTests(){const names=["سارة","فهد","لينا","عمر","منى","هيا","يوسف","سلطان","ريم","خالد","نورة","ماجد","دانة","بدر","أمل","تركي","جود","راشد","مها","عبدالله"];
 const mk=(id,method,a,b,obj,refMode,n,x,date)=>{const t={id,method,a,b,alpha:.05,obj,refMode,date,rows:[]};const used=new Set();
  for(let i=0;i<n;i++){const r=makeRow(t,i,used);r.n=names[i%names.length];const good=((i*7)%n)<x;
   if(method==="triangle"){const odd=[...r.seq].find(c=>r.seq.split(c).length===2);const oi=r.seq.indexOf(odd);r.ans=good?oi:(oi+1)%3}
   else{const ri=r.seq.indexOf(r.ref);r.ans=good?ri:1-ri}t.rows.push(r)}return t};
 return[mk("t1","triangle","f1","f2","diff",null,18,11,"2026-10-15"),mk("t2","duotrio","f1","f2","sim","bal",20,12,"2026-10-16")]}

/* ---------- Assistant (rule-based over local data) ---------- */
function answer(q){
 const ql=q.toLowerCase(),ar=lg()==="ar",f=S.forms[S.cur],c=calc(S.cur);
 const has=(...w)=>w.some(x=>ql.includes(x));
 if(has("اقترح","suggest","خلطة جديدة","new formula","new recipe","propose")){
  const words=ql.split(/[\s،,]+/).filter(w=>w.length>2&&!["اقترح","خلطة","suggest","formula","with","from","the","من","على","مع","أقل","less"].includes(w));
  const sc=a=>words.filter(w=>[a.name,a.cat,a.notes].join(" ").toLowerCase().includes(w.replace(/^ال/,""))).length;
  const top=[...S.approved].sort((x,y)=>sc(y)-sc(x)).slice(0,3);
  return L().localSuggest+"\n"+top.map(a=>{const c=calcRows(a.rows);return `• <b>${esc(a.name)}</b> (${esc(a.code)}) — ${fmt(c.costKg,2)} ${ar?"ر.س/كغ":"SAR/kg"}، ${ar?"بروتين":"protein"} ${fmt(c.n.pro)} g، ${ar?"سكريات":"sugars"} ${fmt(c.n.sug)} g`}).join("\n");}
 if(has("تكلف","cost","سعر","cheap","رخص")){
  const top=c.parts[0];const i=ING[top.k];
  const alt=Object.entries(ING).filter(([k,x])=>x.cat===i.cat&&k!==top.k&&x.cost<i.cost).sort((a,b)=>a[1].cost-b[1].cost)[0];

  if(f.t==="cutset")v[f.k]=[{kind:"pre"},{kind:"knife",spec:m.knives[0]&&m.knives[0].id},{kind:"plate",spec:m.plates[m.plates.length-1]}];

 const m=mById(st.m),out=[];if(!m)return out;const v=st.v,t=L();
 if(v.tOut!==""&&v.tOut!=null&&v.tMax!==""&&v.tMax!=null&&+v.tOut>+v.tMax)out.push(["bad",t.fTemp.replace("{a}",v.tOut).replace("{b}",v.tMax)]);

 TYPES[m.type].fields.forEach(f=>{if(f.rpm)chk(tr(f.l),v[f.k]);if(f.t==="table")f.cols.forEach(c=>{if(c.rpm)(v[f.k]||[]).forEach((r,i)=>chk(tr(c.l)+" #"+(i+1),r[c.k]))})});

const ROLES={admin:{ar:"مدير النظام",en:"Administrator"},rnd:{ar:"البحث والتطوير",en:"R&D"},production:{ar:"الإنتاج",en:"Production"}};

function loadSession(){try{const id=sessionStorage.getItem("fx-uid")||localStorage.getItem("fx-uid");ME=(S.users||[]).find(x=>x.id===id&&x.active!==false)||null}catch(e){ME=null}}

const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function hashPw(pw,salt){const enc=new TextEncoder();
 try{const key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:120000,hash:"SHA-256"},key,256);
  return "p:"+[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("")}
 catch(e){let h=2166136261;const s=salt+":"+pw;for(let r=0;r<3000;r++)for(let i=0;i<s.length;i++){h^=s.charCodeAt(i)+r;h=Math.imul(h,16777619)>>>0}return "f:"+h.toString(16)}}
const findUser=u=>(S.users||[]).find(x=>x.username.toLowerCase()===String(u).trim().toLowerCase());
function checkNewUser(name,username,pw,pw2){const T=L();if(!name.trim())return T.fullName+"؟";if(!/^\S{3,32}$/.test(username))return T.userBad;if(findUser(username))return T.userTaken;if(pw.length<8)return T.pwShort;if(pw2!==undefined&&pw!==pw2)return T.pwMismatch;return ""}
async function makeUser(name,username,role,pw){const salt=newSalt();return{id:"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name.trim(),username:username.trim(),role,salt,hash:await hashPw(pw,salt),active:true,created:today(),last:""}}
function vAuth(){
 const T=L(),setup=!(S.users&&S.users.length);
 const f=(id,lbl,type="text",ac="")=>`<label class="field">${lbl}<input id="${id}" type="${type}" ${ac?`autocomplete="${ac}"`:""} required></label>`;

   ${setup?f("au_name",T.fullName,"text","name"):""}
   ${f("au_user",T.username,"text","username")}
   ${f("au_pw",T.password,"password",setup?"new-password":"current-password")}
   ${setup?f("au_pw2",T.confirmPw,"password","new-password"):`<label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="au_rem"> ${T.remember}</label>`}
   <div id="authErr" class="warnline" role="alert"></div>

function bindAuth(){
 v("authLang").onclick=()=>{S.lang=lg()==="ar"?"en":"ar";persist();render()};
 const err=m=>{v("authErr").textContent=m};
 v("au_user").focus();
 v("authForm").onsubmit=async e=>{e.preventDefault();const T=L(),btn=v("authBtn");
  const user=v("au_user").value.trim(),pw=v("au_pw").value;
  if(!(S.users&&S.users.length)){const name=v("au_name").value;const bad=checkNewUser(name,user,pw,v("au_pw2").value);if(bad){err(bad);return}
   btn.disabled=true;const u=await makeUser(name,user,"admin",pw);u.last=new Date().toISOString().slice(0,16).replace("T"," ");S.users=[u];persist();ME=u;setSession(u,false);tab="dash";render();toast(T.welcome.replace("{n}",u.name));return}
  const now=Date.now();if(now<authLockUntil){err(T.locked.replace("{s}",Math.ceil((authLockUntil-now)/1000)));return}
  btn.disabled=true;const u=findUser(user);const ok=u&&(await hashPw(pw,u.salt))===u.hash;btn.disabled=false;
  if(!ok){authFails++;if(authFails>=5){authLockUntil=Date.now()+30000;authFails=0;err(T.locked.replace("{s}",30))}else err(T.badLogin);v("au_pw").value="";v("au_pw").focus();return}
  if(u.active===false){err(T.disabledUser);return}
  authFails=0;u.last=new Date().toISOString().slice(0,16).replace("T"," ");persist();ME=u;setSession(u,v("au_rem").checked);
  tab="dash";render();toast(T.welcome.replace("{n}",u.name))}}

 if(!isAdmin())return header(T.account,T.accountSub)+mine;

    :`<button class="mini" data-ux="reset" data-uid="${u.id}">${T.resetPw}</button>${u.id!==ME.id?`<button class="mini" data-ux="toggle" data-uid="${u.id}">${u.active===false?T.activate:T.deactivate}</button><button class="x" data-ux="del" data-uid="${u.id}" aria-label="${T.del}">✕</button>`:""}`}</td></tr>`).join("")}

<script>
/* ---------- installable app (PWA) ---------- */
Object.assign(T.ar,{install:"تثبيت التطبيق",installed:"تم تثبيت FormuNex",iosInstall:"للتثبيت على iPhone/iPad: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».",offlineReady:"التطبيق جاهز للعمل بدون إنترنت",updateReady:"يتوفر تحديث — أعد فتح التطبيق"});
Object.assign(T.en,{install:"Install app",installed:"FormuNex installed",iosInstall:"To install on iPhone/iPad: tap Share, then “Add to Home Screen”.",offlineReady:"Ready to work offline",updateReady:"Update available — reopen the app"});
(()=>{
 const btn=document.getElementById("installBtn");let deferred=null;
 const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 btn.textContent=L().install;
 if(ios&&!standalone())btn.hidden=false;
 addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;btn.hidden=false});
 addEventListener("appinstalled",()=>{deferred=null;btn.hidden=true;toast(L().installed)});
 btn.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;btn.hidden=true}else if(ios)toast(L().iosInstall)};
 // Ask the browser not to evict saved data (formulas, users) under storage pressure
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{});
 if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(reg=>{
   reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;w.addEventListener("statechange",()=>{
    if(w.state==="installed")toast(navigator.serviceWorker.controller?L().updateReady:L().offlineReady)})})
  }).catch(()=>{}))}
})();
</script>

<script src="config.js"></script>
